name: CI

on:
  push:
  pull_request:

jobs:
  # -------------------------------------------------------------------------
  # Lint + unit tests (in-memory bus, SQLite-backed ledger/KG; no Docker)
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,test]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        env:
          BUS_BACKEND: memory
          APP_ENV: test
        run: pytest --tb=short -q --cov=packages --cov=services --cov-report=term-missing

  # -------------------------------------------------------------------------
  # Schema migration smoke test against a live Postgres
  # -------------------------------------------------------------------------
  migrate:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: cureforge
          POSTGRES_PASSWORD: cureforge
          POSTGRES_DB: cureforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cureforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,test]"
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://cureforge:cureforge@localhost:5432/cureforge
        run: python -c "from packages.db.connection import run_migrations; run_migrations()"

  # -------------------------------------------------------------------------
  # Integration tests against live Postgres + Redis via docker-compose
  # -------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - name: Build and run integration tests via docker-compose
        run: |
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test
          docker compose -f docker-compose.test.yml down --volumes

  # -------------------------------------------------------------------------
  # Dependency vulnerability scan
  # -------------------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,test]"
      - name: pip-audit (non-blocking)
        # Allow this job to fail without blocking the pipeline; the report
        # is uploaded to the CI logs so security can review.
        continue-on-error: true
        run: pip-audit
