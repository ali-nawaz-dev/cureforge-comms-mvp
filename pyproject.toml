[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cureforge-comms-mvp"
version = "0.1.0"
description = "CureForge communications MVP with signal ingestion, matching, HITL outreach, and specialist drafting stubs."
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.4",
  "python-dotenv==1.2.1",
  "streamlit==1.57.0",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "redis[hiredis]>=5.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "click>=8.1",
  "tenacity>=8.2",
  "prometheus-client>=0.20",
  "svix>=1.30",
]

[project.optional-dependencies]
dev = [
  "ruff==0.14.9",
  "pytest==9.0.2",
  "pytest-asyncio>=0.23",
  "fakeredis>=2.23",
  "respx>=0.21",
  "pip-audit>=2.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "services*"]

